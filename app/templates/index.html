<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<div class="app-wrapper">
   
   <aside class="sidebar">
    <div class="logo-area">
        <span class="icon" style="font-size: 30px;">🛡️</span>
        <h2>Détection de fraude</h2>
        <p>Saisissez les paramètres de la transaction pour l'analyse IA.</p>
    </div>

   
    <div class="nav-group">
        <button type="submit" form="fraud-form" class="btn-submit">
            Analyser maintenant
        </button>
        
        <a href="/dashboard" class="btn-secondary">
              Dashboard
        </a>
    </div>

   
    <div style="margin-top: auto; font-size: 12px; color: var(--text-sub);">
        © 2026 AI Fraud Guard
    </div>
</aside>
   
    <main class="content">
        <form id="fraud-form" action="/result" method="POST">
            
            <section class="card">
                <h3>Informations Générales</h3>
                <div class="grid-2">
                    <div class="input-field">
                        <label>Time</label>
                        <input type="number" step="any" name="Time" >
                    </div>
                    <div class="input-field">
                        <label>Amount</label>
                        <input type="number" step="any" name="Amount" required placeholder="Montant en €">
                    </div>
                </div>
            </section>

            <section class="card">
                <h3>Composantes PCA (V1 - V28)</h3>
                <div class="pca-grid">
                    {% for i in range(1,29) %}
                    <div class="input-field mini">
                        <label>V{{i}}</label>
                        <input type="number" step="any" name="V{{i}}" required>
                    </div>
                    {% endfor %}
                </div>
            </section>
        </form>
    </main>
</div>
